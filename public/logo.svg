<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <!--
    LatentBridge real logo:
    - Left cluster: 4 tall bars, decreasing in height left→right, dark blue
    - Right: one very wide tall panel, light blue
    - A concave arch cap connects all tops (bridge silhouette)
    - Gap between left bars and right panel
  -->

  <!-- LEFT BARS — dark blue #1a7fc1 -->
  <!-- Bar 1 -->
  <rect x="8"   y="30"  width="44" height="165" rx="3" fill="#1a7fc1"/>
  <!-- Bar 2 -->
  <rect x="60"  y="52"  width="44" height="143" rx="3" fill="#1a7fc1"/>
  <!-- Bar 3 -->
  <rect x="112" y="78"  width="44" height="117" rx="3" fill="#1a7fc1"/>
  <!-- Bar 4 (shortest of left cluster) -->
  <rect x="164" y="108" width="44" height="87"  rx="3" fill="#1a7fc1"/>

  <!-- RIGHT WIDE PANEL — light blue #29aae1 -->
  <rect x="228" y="20"  width="324" height="175" rx="3" fill="#29aae1"/>

  <!-- ARCH CAP — concave curve connecting all bar tops, acting as the bridge arc -->
  <!-- Left arch over bars: starts high-left, curves down to ~bar4 height -->
  <path d="
    M8,30
    C30,8 55,30 82,52
    C108,72 135,80 164,108
    L208,108
    C175,78 148,68 120,46
    C92,24 55,2 8,24
    Z
  " fill="#1a7fc1"/>

  <!-- Right arch over wide panel: curves from bar4 level up to top-right -->
  <path d="
    M228,20
    C320,-18 460,-18 552,20
    L552,24
    C460,-14 320,-14 228,24
    Z
  " fill="#29aae1"/>

  <!-- Connector between left arch and right panel arch -->
  <path d="M164,108 L208,108 L228,24 L208,108 C210,90 218,60 228,20 L228,24 C218,64 210,92 208,112 L164,112 Z" fill="#29aae1" opacity="0.9"/>

  <!-- "LatentBridge" wordmark -->
  <text x="8" y="262"
    font-family="Arial, Helvetica, sans-serif"
    font-size="76" font-weight="700"
    fill="#1a7fc1"
    letter-spacing="-1">LatentBridge</text>

  <!-- "Workflows to Outcomes" tagline -->
  <text x="12" y="315"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28" font-weight="400"
    fill="#29aae1"
    letter-spacing="4.5">Workflows to Outcomes</text>
</svg>
